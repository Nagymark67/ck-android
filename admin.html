<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Felhasználókezelés</title>
  <link rel="icon" type="image/png" href="ck_cimer_szines.png">
  <link rel="stylesheet" href="ck_fooldal.css">
  <style>
    body { padding:20px; font-family:inherit; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:8px; border:1px solid #ddd; }
    select { min-width:160px; }
    .small { font-size:0.9em; color:#666; }
  </style>
</head>
<body>
  <h1>Admin felület</h1>
  <button id="adminLogout" type="button">Kijelentkezés</button>
  <p class="small">Csak<strong> admin</strong> fiókkal elérhető.</p>
  <div id="notice"></div>
  <table>
    <thead>
      <tr><th>ID</th><th>Felhasználónév</th><th>E-mail</th><th>Státusz</th><th>Szerepek</th><th>Műveletek</th></tr>
    </thead>
    <tbody id="usersBody"><tr><td colspan="6">Betöltés...</td></tr></tbody>
  </table>
  <h2>Függőben lévő galériaképek</h2>
  <div id="pendingGallery"><p>Betöltés...</p></div>

<script src="api-config.js"></script>
<script>
(async function(){
  async function showNotice(msg, err) {
    const n = document.getElementById('notice');
    n.textContent = msg; n.style.color = err ? 'crimson' : 'green';
    setTimeout(()=>{ n.textContent = ''; }, 5000);
  }
  try {

    const me = await window.ckApiFetch('/me');
    if (!me.ok) { document.getElementById('usersBody').innerHTML = '<tr><td colspan="6">Nem vagy bejelentkezve</td></tr>'; return; }
    const md = await me.json();
    if (!md.isAllTimeAdmin) { document.getElementById('usersBody').innerHTML = '<tr><td colspan="6">Nincs jogosultsága ennek az oldalnak az eléréséhez.</td></tr>'; return; }

    const res = await window.ckApiFetch('/admin/users');
    if (!res.ok) { document.getElementById('usersBody').innerHTML = '<tr><td colspan="6">Hiba a felhasználók lekérésekor</td></tr>'; return; }
    const d = await res.json();
    const tbody = document.getElementById('usersBody'); tbody.innerHTML = '';
    const statuses = ['', 'Szimpatizáns','Tanítvány','Tag','Jegyző','Alapító','Cantus Praeses','Alapító'];
    d.users.forEach(u => {
      const tr = document.createElement('tr');
      const rolesText = (u.roles && u.roles.length) ? u.roles.join(', ') : '';
      tr.innerHTML = `<td>${u.id}</td><td>${u.username}</td><td></td><td></td><td>${rolesText}</td><td></td>`;
      const emailCell = tr.children[2];
      const statusCell = tr.children[3];
      const opsCell = tr.children[5];
      const emailInput = document.createElement('input');
      emailInput.type = 'email'; emailInput.value = u.email || ''; emailInput.placeholder = 'email@example.com';
      const emailSave = document.createElement('button'); emailSave.textContent = 'Mentés';
      emailSave.addEventListener('click', async () => {
        const r = await window.ckApiFetch('/admin/users/' + u.id + '/email', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: emailInput.value }) });
        const result = await r.json().catch(() => ({}));
        showNotice(r.ok ? 'E-mail cím mentve' : (result.message || 'Hiba'), !r.ok);
      });
      emailCell.append(emailInput, emailSave);
      const sel = document.createElement('select');
      ['', 'Szimpatizáns','Tanítvány','Tag','Jegyző','Alapító','Cantus Praeses'].forEach(s => {
        const o = document.createElement('option'); o.value = s; o.text = s || '(nincs)';
        if (s === u.status) o.selected = true;
        sel.appendChild(o);
      });
      statusCell.appendChild(sel);
      const saveBtn = document.createElement('button'); saveBtn.textContent = 'Mentés';
      saveBtn.addEventListener('click', async () => {
        const newStatus = sel.value || null;
        const r = await window.ckApiFetch('/admin/users/' + u.id + '/status', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ status: newStatus }) });
        if (r.ok) { showNotice('Státusz frissítve'); } else { showNotice('Hiba a mentéskor', true); }
      });
      opsCell.appendChild(saveBtn);


      const roleInput = document.createElement('input'); roleInput.placeholder='role pl. cantus_praeses'; roleInput.style.marginLeft='8px';
      const addBtn = document.createElement('button'); addBtn.textContent = 'Hozzáad';
      addBtn.addEventListener('click', async () => {
        const role = roleInput.value.trim(); if (!role) { showNotice('Írjon be egy szerepet', true); return; }
        const r = await window.ckApiFetch('/admin/users/' + u.id + '/roles', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ role, action: 'add' }) });
        if (r.ok) { showNotice('Szerep hozzáadva'); location.reload(); } else showNotice('Hiba', true);
      });
      const remBtn = document.createElement('button'); remBtn.textContent = 'Eltávolít';
      remBtn.addEventListener('click', async () => {
        const role = roleInput.value.trim(); if (!role) { showNotice('Írjon be egy szerepet', true); return; }
        const r = await window.ckApiFetch('/admin/users/' + u.id + '/roles', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ role, action: 'remove' }) });
        if (r.ok) { showNotice('Szerep eltávolítva'); location.reload(); } else showNotice('Hiba', true);
      });
      opsCell.appendChild(roleInput); opsCell.appendChild(addBtn); opsCell.appendChild(remBtn);
      const resetBtn = document.createElement('button'); resetBtn.textContent = 'Jelszó visszaállítása';
      resetBtn.addEventListener('click', async () => {
        if (!window.confirm(`Biztosan visszaállítod ${u.username} jelszavát?`)) return;
        const r = await window.ckApiFetch('/admin/users/' + u.id + '/reset-password', { method: 'POST' });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) { showNotice(result.message || 'Hiba a jelszó visszaállításakor', true); return; }
        if (result.emailSent) showNotice(`Jelszó visszaállítva és elküldve erre: ${u.email}`);
        else {
          window.prompt(`Ideiglenes jelszó ${u.username} számára. Add át a felhasználónak; egyszer használható:`, result.temporaryPassword);
          showNotice(result.message || 'Jelszó visszaállítva. A felhasználónak új jelszót kell beállítania.');
        }
      });
      opsCell.appendChild(resetBtn);

      tbody.appendChild(tr);
    });
    const pendingGallery = document.getElementById('pendingGallery');
    const pendingResponse = await window.ckApiFetch('/admin/gallery/pending');
    const pendingData = pendingResponse.ok ? await pendingResponse.json() : { images: [] };
    pendingGallery.replaceChildren();
    if (!pendingData.images.length) {
      pendingGallery.textContent = 'Nincs jóváhagyásra váró kép.';
    } else {
      pendingData.images.forEach((image) => {
        const card = document.createElement('figure');
        const preview = document.createElement('img');
        preview.src = image.image_url;
        preview.alt = image.alt_text || '';
        preview.style.maxWidth = '220px';
        preview.style.display = 'block';
        const caption = document.createElement('figcaption');
        caption.textContent = `Feltöltő: ${image.uploaded_by}`;
        const approve = document.createElement('button');
        approve.textContent = 'Jóváhagyás';
        approve.addEventListener('click', async () => {
          const response = await window.ckApiFetch('/admin/gallery/' + image.id + '/approve', { method: 'POST' });
          if (response.ok) location.reload();
          else showNotice('A kép jóváhagyása nem sikerült.', true);
        });
        const reject = document.createElement('button');
        reject.textContent = 'Elutasítás';
        reject.addEventListener('click', async () => {
          const response = await window.ckApiFetch('/admin/gallery/' + image.id, { method: 'DELETE' });
          if (response.ok) location.reload();
          else showNotice('A kép elutasítása nem sikerült.', true);
        });
        card.append(preview, caption, approve, reject);
        pendingGallery.appendChild(card);
      });
    }
    document.getElementById('adminLogout').addEventListener('click', async () => {
      const response = await window.ckApiFetch('/logout', { method: 'POST' });
      if (response.ok) window.location.href = 'login.html';
      else showNotice('A kijelentkezés nem sikerült.', true);
    });
  } catch (e) {
    document.getElementById('usersBody').innerHTML = '<tr><td colspan="6">Hiba: ' + (e.message || e) + '</td></tr>';
  }
})();
</script>
</body>
</html>
